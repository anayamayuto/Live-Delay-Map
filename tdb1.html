 <h1>混雑を予測するアプリの提案</h1>

 <h2>概要</h1>

 <p>駅や観光地、ショッピングモールの混雑情報を色で可視化するアプリ</p>

 <h3>主な機能</h2>

 <p>・地図上に色でわかる混雑具合
    <br>・過去の混雑傾向の可視化
    <br>・混雑予測の表示
 </p>

 <h4>使用データ</h3>

 <p>・GPSからの人流データ
    <br>・過去の人流データ
    <br>・天気予報データ
 </p>
